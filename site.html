<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>صفحتي | My page</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#000000">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src blob: data:; connect-src 'none'; base-uri 'none'; form-action 'none'">
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&family=Aref+Ruqaa:wght@700&family=Dancing+Script:wght@700&family=El+Messiri:wght@600;700&display=swap" rel="stylesheet">
<style>
/* ------------------------------------------------------------------
   Client page ("cs") — same glass + card-deck look as the portfolio.
   Everything is scoped under .cs and sized from its own container,
   so the same markup renders full-screen (site.html) or inside the
   phone preview in the builder.
------------------------------------------------------------------- */

.cs {
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
  --spring: cubic-bezier(0.34, 1.45, 0.64, 1);
  --card: #232329;
  --veil-k: 1;
  --name-shadow: 0 0 8px rgba(255, 255, 255, 0.4);
  position: relative;
  width: 100%;
  height: 100%;
  overflow: hidden;
  container-type: size;
  isolation: isolate;
  --fg: #fff;
  color: var(--fg);
  font-family: 'Cairo', system-ui, -apple-system, 'Segoe UI', sans-serif;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  -webkit-text-size-adjust: 100%;
  background: #000;
}
.cs *, .cs *::before, .cs *::after { box-sizing: border-box; }
.cs[data-theme="blue"]  { --card: #0c2560; --veil-k: 0.9; --name-shadow: 0 2px 14px rgba(0, 10, 60, 0.45); }
.cs[data-theme="pink"]  { --card: #3b1228; --veil-k: 0.9; --name-shadow: 0 2px 14px rgba(70, 0, 35, 0.45); }
.cs[data-theme="brown"] { --card: #3a251a; --veil-k: 0.9; --name-shadow: 0 2px 14px rgba(0, 0, 0, 0.4); }
/* soft white: light page, same dark glass cards as the portfolio's light mode */
.cs[data-theme="white"] {
  --fg: #12131a; --card: #2a2c36; --veil-k: 0.92; --name-shadow: none; --wish-shadow: none; --bio-shadow: none;
}
.cs[data-theme="white"] .cs-avatar { border-color: rgba(18, 19, 26, 0.16); background-color: rgba(18, 19, 26, 0.07); box-shadow: 0 10px 24px rgba(30, 40, 80, 0.22); }
.cs[data-theme="white"] .cs-card { box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2), inset 0 -1px 2px rgba(0, 0, 0, 0.15); }
.cs[data-theme="white"] .cs-slot { box-shadow: 0 16px 30px rgba(30, 40, 80, 0.3); }
.cs[data-theme="white"] .cs-timer { background: rgba(184, 134, 11, 0.16); border-color: rgba(138, 101, 8, 0.45); }
.cs[data-theme="white"] .cs-meteors { display: none; }

/* ---- backgrounds: one layer per theme, cross-faded ---- */
.cs-bg { position: absolute; inset: 0; z-index: -3; opacity: 0; transition: opacity 0.9s var(--ease); overflow: hidden; }
.cs-bg.on { opacity: 1; }
.cs-bg.t-black { background: radial-gradient(120% 70% at 50% -8%, #23242b 0%, #0b0b0e 52%, #000 100%); }
.cs-bg.t-blue {
  background:
    radial-gradient(92% 46% at 26% -4%, rgba(255, 255, 255, 0.46) 0%, rgba(255, 255, 255, 0) 62%),
    radial-gradient(70% 40% at 90% 100%, rgba(80, 200, 255, 0.35) 0%, rgba(80, 200, 255, 0) 70%),
    linear-gradient(162deg, #1f70ff 0%, #0c47e2 34%, #0a2fa8 64%, #05155e 100%);
}
.cs-bg.t-pink {
  background:
    radial-gradient(90% 44% at 72% -6%, rgba(255, 196, 224, 0.55) 0%, rgba(255, 196, 224, 0) 62%),
    linear-gradient(165deg, #e0357f 0%, #c4226c 42%, #8a1450 74%, #4d0a2f 100%);
}
.cs-bg.t-brown {
  background:
    radial-gradient(76% 40% at 50% -6%, rgba(228, 164, 108, 0.38) 0%, rgba(228, 164, 108, 0) 66%),
    linear-gradient(170deg, #4d2e1e 0%, #33190d 50%, #1b0d06 100%);
}
.cs-bg.t-white {
  background:
    radial-gradient(90% 52% at 18% -8%, #ffffff 0%, rgba(255, 255, 255, 0) 64%),
    radial-gradient(72% 42% at 92% 104%, rgba(140, 166, 255, 0.30) 0%, rgba(140, 166, 255, 0) 70%),
    linear-gradient(165deg, #ffffff 0%, #f1f3fa 42%, #e2e7f3 100%);
}
/* a slow glint that crosses the glossy themes */
.cs-bg.t-blue::after, .cs-bg.t-pink::after {
  content: ""; position: absolute; inset: -20% -60%;
  background: linear-gradient(112deg, transparent 40%, rgba(255, 255, 255, 0.13) 50%, transparent 60%);
  transform: translateX(-70%);
  animation: csGlint 11s ease-in-out 1.2s infinite;
}
@keyframes csGlint { 0%, 55% { transform: translateX(-70%); } 100% { transform: translateX(70%); } }

/* ---- shooting stars (same as the portfolio) ---- */
.cs-meteors { position: absolute; inset: 0; z-index: -2; pointer-events: none; overflow: hidden; }
.cs-meteor {
  position: absolute; top: -5%; right: -5%; width: 15px; height: 1px;
  background: linear-gradient(to right, rgba(0, 0, 0, 0) 0%, rgba(255, 255, 255, 1) 100%);
  opacity: 0; animation: csMeteor 20s linear 3.5s infinite;
}
.cs-meteor::after {
  content: ""; position: absolute; right: 0; top: -0.5px; width: 1.5px; height: 1.5px;
  background: #fff; border-radius: 50%; box-shadow: 0 0 3px 1px #fff, 0 0 6px 2px #4db8ff;
}
.cs-meteor.m2 { top: -2%; right: -15%; width: 8px; animation-delay: 4.5s; }
@keyframes csMeteor {
  0% { transform: rotate(135deg) translateX(-50px); opacity: 0; }
  2% { opacity: 1; }
  75% { transform: rotate(135deg) translateX(1800px); opacity: 0; }
  100% { transform: rotate(135deg) translateX(1800px); opacity: 0; }
}

/* ---- layout ---- */
.cs-scroll {
  position: absolute; inset: 0; overflow-x: hidden; overflow-y: auto;
  display: flex; flex-direction: column; align-items: center;
  padding: 40px 18px 22px;
  padding-top: clamp(28px, 9cqh, 96px);
  scrollbar-width: none; -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
}
.cs-scroll::-webkit-scrollbar { display: none; }
.cs-main { width: 100%; max-width: 340px; display: flex; flex-direction: column; align-items: center; text-align: center; }

.cs-avatar {
  position: relative; width: 90px; height: 90px; border-radius: 50%; flex: 0 0 auto;
  border: 3px solid rgba(255, 255, 255, 0.28);
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
  background: rgba(255, 255, 255, 0.1) center / cover no-repeat;
  display: grid; place-items: center; overflow: hidden;
  margin-bottom: 12px;
  font-family: 'El Messiri', 'Cairo', sans-serif; font-size: 40px; font-weight: 700; color: var(--fg); text-transform: uppercase;
  animation: csPulse 5s ease-in-out 1s infinite;
}
.cs-avatar img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: block; -webkit-user-drag: none; }
.cs-avatar[hidden] { display: none; }
@keyframes csPulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.03); }
}

.cs-name {
  font-family: 'Dancing Script', 'Cairo', cursive; font-weight: 700; font-size: 30px; line-height: 1.35;
  color: var(--fg); text-shadow: var(--name-shadow); max-width: 100%; overflow-wrap: anywhere;
  margin-bottom: 6px;
  animation: csFloat 4s ease-in-out 1.6s infinite;
}
.cs-name.is-ar { font-family: 'Aref Ruqaa', 'Cairo', serif; font-size: 32px; line-height: 1.5; }
.cs-name:empty { display: none; }
@keyframes csFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }

.cs-bio {
  font-size: 14px; font-weight: 600; line-height: 1.7; max-width: 300px; opacity: 0.92;
  text-shadow: var(--bio-shadow, 0 1px 8px rgba(0, 0, 0, 0.35)); overflow-wrap: anywhere;
}
.cs-bio:empty { display: none; }

.cs-wish {
  font-family: 'Dancing Script', cursive; font-size: 15.2px; margin-top: 22px; color: var(--fg);
  text-shadow: var(--wish-shadow, 0 0 6px rgba(255, 255, 255, 0.35));
}
.cs[lang="ar"] .cs-wish { font-family: 'Aref Ruqaa', 'Cairo', serif; font-size: 18px; }

/* ---- the deck ---- */
.cs-deck {
  position: relative; display: block; width: 100%; height: 244px; margin-top: 8px;
  perspective: 760px; perspective-origin: 50% 46%;
  touch-action: pan-y; cursor: grab;
}
.cs-deck.is-dragging, .cs-deck.is-dragging * { cursor: grabbing !important; }
.cs-slot {
  position: absolute; left: 50%; top: 50%;
  width: min(144px, 44%); height: 204px; display: block; border-radius: 26px;
  transform: translate(-50%, -50%); transform-origin: 50% 50%;
  box-shadow: 0 16px 34px rgba(0, 0, 0, 0.45);
  transition: transform 0.62s var(--ease), opacity 0.4s ease;
  will-change: transform, opacity;
  -webkit-tap-highlight-color: transparent;
}
.cs-deck.is-dragging .cs-slot, .cs-deck.no-trans .cs-slot { transition: none !important; }
.cs-slot.is-leaving { opacity: 0 !important; pointer-events: none; transition: opacity 0.25s ease !important; }

.cs-card {
  position: relative; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
  width: 100%; height: 100%; border-radius: 26px; overflow: hidden;
  color: #fff; text-decoration: none;
  background-color: var(--card);
  background-image:
    radial-gradient(130% 75% at 50% 0%, rgba(var(--accent, 255, 255, 255), 0.34) 0%, rgba(var(--accent, 255, 255, 255), 0) 74%),
    linear-gradient(165deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0) 55%);
  border: 1px solid rgba(255, 255, 255, 0.15);
  border-top: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: inset 0 1px 2px rgba(255, 255, 255, 0.2), inset 0 -1px 2px rgba(0, 0, 0, 0.15);
  -webkit-touch-callout: none; -webkit-user-drag: none; user-select: none; -webkit-user-select: none;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  outline-offset: 3px;
}
.cs-card::before {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 1;
  background: #000; opacity: calc(var(--veil, 0) * var(--veil-k));
  transition: opacity 0.62s var(--ease);
}
.cs-deck.is-dragging .cs-card::before, .cs-deck.no-trans .cs-card::before { transition: none; }
.cs-card:focus-visible { outline: 2px solid #fff; }
.cs-card.is-empty { background-image: none; background-color: rgba(255, 255, 255, 0.05); border: 1.5px dashed rgba(255, 255, 255, 0.4); box-shadow: none; opacity: 0.9; }
.cs-card.is-empty .ico { opacity: 0.7; }
.cs-slot:has(.is-empty) { box-shadow: none; }
.cs-slot:has(.is-empty) .cs-share-btn { display: none; }
.cs-card .ico-brand { width: 52px; height: 52px; color: var(--brand, #fff); filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.6)); }
.cs-card .ico-tt { filter: drop-shadow(-1.5px -1.5px 0 #25F4EE) drop-shadow(1.5px 1.5px 0 #FE2C55) drop-shadow(0 3px 5px rgba(0, 0, 0, 0.5)); }
.cs-card .ico:not(.ico-brand) { width: 46px; height: 46px; color: #fff; filter: drop-shadow(0 3px 5px rgba(0, 0, 0, 0.6)); stroke-width: 1.7; }
.cs-card .cs-label {
  max-width: 118px; font-size: 13.5px; font-weight: 700; line-height: 1.3; text-align: center;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding: 0 4px;
}

.cs-share-btn {
  position: absolute; left: 50%; bottom: 14px; z-index: 3;
  width: 34px; height: 34px; padding: 0; border-radius: 50%; display: grid; place-items: center;
  color: rgba(255, 255, 255, 0.92); cursor: pointer;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.25) 0%, rgba(255, 255, 255, 0.05) 100%);
  -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  border: 1px solid rgba(255, 255, 255, 0.3); border-top: 1px solid rgba(255, 255, 255, 0.6);
  box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2), inset 0 1px 2px rgba(255, 255, 255, 0.4);
  transform: translateX(-50%);
  transition: transform 0.42s var(--ease), opacity 0.35s ease, background 0.3s ease;
  -webkit-tap-highlight-color: transparent; touch-action: manipulation;
}
.cs-share-btn .ico { width: 15px; height: 15px; }
@media (hover: hover) { .cs-share-btn:hover { transform: translateX(-50%) scale(1.14); background: linear-gradient(135deg, rgba(255, 255, 255, 0.4), rgba(255, 255, 255, 0.15)); } }
.cs-share-btn:active { transform: translateX(-50%) scale(0.9); }
.cs-share-btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.cs-slot:not(.is-front) .cs-share-btn { opacity: 0; pointer-events: none; transform: translateX(-50%) scale(0.6); }
.cs.is-preview .cs-share-btn { pointer-events: none; }

/* ---- redirect counter (same pill as the portfolio) ---- */
.cs-timer {
  width: min(232px, 100%); align-self: center; max-height: 0; opacity: 0; margin-top: 0; padding: 0 15px; overflow: hidden;
  display: flex; align-items: center; justify-content: center;
  background: rgba(184, 134, 11, 0.18); border: 1px solid rgba(184, 134, 11, 0.4); border-radius: 12px;
  font-size: 12px; font-weight: 600; color: var(--fg); -webkit-backdrop-filter: blur(5px); backdrop-filter: blur(5px);
  transition: all 0.5s var(--ease);
}
.cs-timer.active { max-height: 50px; opacity: 1; margin-top: 8px; padding: 8px 15px; }
.cs-timer .row { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; }
.cs-cancel {
  background: transparent; border: 1px solid #ff4d4d; color: #ff6b6b; border-radius: 10px; padding: 2px 8px;
  font: 700 11px 'Cairo', sans-serif; cursor: pointer; transition: all 0.3s var(--ease);
}
.cs-cancel:hover { background: #ff4d4d; color: #fff; }
.cs-cancel:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.cs-spin { display: inline-block; position: relative; width: 18px; height: 18px; color: inherit; flex: 0 0 auto; }
.cs-spin i { position: absolute; left: 8px; top: 0; width: 2px; height: 5.5px; background: currentColor; border-radius: 1.5px; transform-origin: 1px 9px; opacity: 0; animation: csSpin 1s linear infinite; }
.cs-spin i:nth-child(1) { transform: rotate(0deg); animation-delay: -0.9167s; }
.cs-spin i:nth-child(2) { transform: rotate(30deg); animation-delay: -0.8333s; }
.cs-spin i:nth-child(3) { transform: rotate(60deg); animation-delay: -0.75s; }
.cs-spin i:nth-child(4) { transform: rotate(90deg); animation-delay: -0.6667s; }
.cs-spin i:nth-child(5) { transform: rotate(120deg); animation-delay: -0.5833s; }
.cs-spin i:nth-child(6) { transform: rotate(150deg); animation-delay: -0.5s; }
.cs-spin i:nth-child(7) { transform: rotate(180deg); animation-delay: -0.4167s; }
.cs-spin i:nth-child(8) { transform: rotate(210deg); animation-delay: -0.3333s; }
.cs-spin i:nth-child(9) { transform: rotate(240deg); animation-delay: -0.25s; }
.cs-spin i:nth-child(10) { transform: rotate(270deg); animation-delay: -0.1667s; }
.cs-spin i:nth-child(11) { transform: rotate(300deg); animation-delay: -0.0833s; }
.cs-spin i:nth-child(12) { transform: rotate(330deg); animation-delay: 0s; }
@keyframes csSpin { 0% { opacity: 0.9; } 100% { opacity: 0.15; } }
.cs-done { color: #4CAF50; display: inline-grid; }
.cs-done .ico { width: 18px; height: 18px; stroke-width: 2.6; }

/* ---- share popup ---- */
.cs-overlay {
  position: absolute; inset: 0; z-index: 20; background: rgba(0, 0, 0, 0.55);
  -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  opacity: 0; visibility: hidden; transition: opacity 0.4s var(--ease), visibility 0.4s;
}
.cs-overlay.active { opacity: 1; visibility: visible; }
.cs-pop {
  position: absolute; left: 50%; top: 50%; z-index: 21; width: min(280px, calc(100% - 32px));
  transform: translate(-50%, -44%) scale(0.92); opacity: 0; visibility: hidden;
  display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center;
  padding: 24px 22px 22px; border-radius: 28px;
  background: rgba(15, 15, 15, 0.45); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
  transition: transform 0.7s var(--spring), opacity 0.35s ease, visibility 0.7s;
}
.cs-pop.active { transform: translate(-50%, -50%) scale(1); opacity: 1; visibility: visible; }
.cs-pop h3 { font-size: 17px; font-weight: 700; }
.cs-pop p { font-size: 12px; font-weight: 600; color: rgba(255, 255, 255, 0.66); margin-top: -6px; overflow-wrap: anywhere; }
.cs-pop-btn {
  width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px; padding: 12px 16px; border-radius: 15px;
  background: rgba(255, 255, 255, 0.14); color: #fff; font: 700 13.5px 'Cairo', sans-serif; cursor: pointer;
  border: 1px solid rgba(255, 255, 255, 0.16); border-top: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 5px 15px rgba(0, 0, 0, 0.35), inset 0 1px 2px rgba(255, 255, 255, 0.2);
  transition: transform 0.3s var(--ease), background 0.3s ease;
}
.cs-pop-btn:active { transform: scale(0.95); }
@media (hover: hover) { .cs-pop-btn:hover { background: rgba(255, 255, 255, 0.22); } }
.cs-pop-btn:focus-visible, .cs-pop-x:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
.cs-pop-btn .ico { width: 18px; height: 18px; }
.cs-pop-x {
  position: absolute; top: 12px; inset-inline-end: 12px; width: 30px; height: 30px; display: grid; place-items: center; border-radius: 50%;
  background: rgba(255, 255, 255, 0.1); border: 1px solid rgba(255, 255, 255, 0.18); color: #fff; cursor: pointer; opacity: 0.8;
}
.cs-pop-x .ico { width: 14px; height: 14px; }

/* ---- entrance (live page only) ---- */
@keyframes csPop { 0% { opacity: 0; scale: 1.1; } 100% { opacity: 1; scale: 1; } }
@keyframes csRise { 0% { opacity: 0; translate: 0 15px; } 100% { opacity: 1; translate: 0 0; } }
.cs.is-intro .cs-avatar { animation: csPop 0.8s var(--ease) 0.1s both, csPulse 5s ease-in-out 1.4s infinite; }
.cs.is-intro .cs-name { animation: csRise 1s var(--ease) 0.25s both, csFloat 4s ease-in-out 1.6s infinite; }
.cs.is-intro .cs-bio { animation: csRise 1s var(--ease) 0.4s both; }
.cs.is-intro .cs-card { animation: csPop 0.8s var(--ease) calc(0.45s + var(--i, 0) * 0.1s) both; }
.cs.is-intro .cs-wish { animation: csRise 1s var(--ease) 1.1s both; }

/* preview inside the builder's phone: static (the phone itself does the moving) */
.cs.is-preview *, .cs.is-preview *::before, .cs.is-preview *::after { animation: none !important; }
.cs.is-preview .cs-meteors, .cs.is-preview .cs-overlay, .cs.is-preview .cs-pop { display: none; }
.cs.is-preview .cs-share-btn { -webkit-backdrop-filter: none; backdrop-filter: none; }

@media (prefers-reduced-motion: reduce) {
  .cs *, .cs *::before, .cs *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}

html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
#app { position: fixed; inset: 0; }
.bad {
  position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; color: #fff; background: radial-gradient(120% 70% at 50% -8%, #23242b 0%, #0b0b0e 52%, #000 100%);
  font-family: 'Cairo', system-ui, sans-serif;
}
.bad-card {
  width: min(340px, 100%); padding: 28px 22px 22px; border-radius: 28px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 10px;
  background: rgba(15, 15, 15, 0.45); -webkit-backdrop-filter: blur(30px) saturate(180%); backdrop-filter: blur(30px) saturate(180%);
  border: 1px solid rgba(255, 255, 255, 0.15); border-top: 1px solid rgba(255, 255, 255, 0.35);
  box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6), inset 0 1px 2px rgba(255, 255, 255, 0.2);
}
.bad-card .ico { width: 34px; height: 34px; color: #ff6b6b; }
.bad-card h1 { font-size: 1.05rem; font-weight: 800; line-height: 1.6; }
.bad-card p { font-size: 0.82rem; font-weight: 600; line-height: 1.8; color: rgba(255, 255, 255, 0.66); }
.bad-card a {
  margin-top: 8px; display: inline-flex; align-items: center; justify-content: center; padding: 12px 22px; border-radius: 15px; color: #fff; text-decoration: none; font-weight: 800; font-size: 0.9rem;
  background: linear-gradient(135deg, rgba(255, 215, 0, 0.22) 0%, rgba(184, 134, 11, 0.08) 100%); border: 1px solid rgba(255, 215, 0, 0.5);
}
.bad-card a:focus-visible { outline: 2px solid #fff; outline-offset: 3px; }
</style>
</head>
<body>
<div id="app"></div>
<noscript><p style="position:fixed;inset:0;display:grid;place-items:center;background:#000;color:#fff;font:600 16px sans-serif;text-align:center;padding:24px">يتطلب هذا الموقع تفعيل JavaScript.</p></noscript>
<script>
/* ------------------------------------------------------------------
   Platforms, link parsing/validation, and the config codec.
   Shared by the builder (builder.html) and the viewer (site.html).

/* ---------------- text cleanup ---------------- */
function normalizeInput(s) {
  return String(s == null ? '' : s)
    .replace(/[٠-٩]/g, (d) => String(d.charCodeAt(0) - 0x0660))
    .replace(/[۰-۹]/g, (d) => String(d.charCodeAt(0) - 0x06F0))
    .replace(/[​-‏‪-‮⁦-⁩﻿]/g, '')
    .trim();
}

function parseWebUrl(raw) {
  let s = normalizeInput(raw);
  if (!s || /\s/.test(s)) return null;
  if (!/^https?:\/\//i.test(s)) {
    if (/^[a-z][a-z0-9+.-]*:/i.test(s)) return null; // some other scheme (javascript:, data:, ...)
    s = 'https://' + s;
  }
  let u;
  try { u = new URL(s); } catch (e) { return null; }
  if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
  if (u.username || u.password) return null;
  if (!/^[^.]+(\.[^.]+)+$/.test(u.hostname)) return null;
  if (s.length > 400) return null;
  return u;
}

function shortShown(u) {
  let t = u.host.replace(/^www\./i, '') + (u.pathname === '/' ? '' : u.pathname.replace(/\/$/, ''));
  return t.length > 48 ? t.slice(0, 47) + '…' : t;
}

function hostAllowed(host, hosts) {
  host = host.toLowerCase();
  return hosts.some((h) => host === h || host.endsWith('.' + h));
}

function makeHandleParser(p) {
  return function (raw) {
    const s = normalizeInput(raw);
    if (!s) return { empty: true };
    const lower = s.toLowerCase();
    const looksUrl = /^https?:\/\//i.test(s) || s.indexOf('/') !== -1 || /^(www\.|m\.)/i.test(s) ||
      p.hosts.some((h) => lower.indexOf(h) === 0);
    if (looksUrl) {
      const u = parseWebUrl(s);
      if (!u) return { ok: false, code: 'url' };
      if (!hostAllowed(u.hostname, p.hosts)) return { ok: false, code: 'host' };
      if (u.pathname.length <= 1 && !u.search) return { ok: false, code: 'path' };
      return { ok: true, url: u.href, shown: shortShown(u) };
    }
    const h = s.replace(/^@+/, '');
    if (!p.re.test(h)) return { ok: false, code: 'handle' };
    const url = p.build(h);
    return { ok: true, url: url, shown: shortShown(new URL(url)) };

}

const EMAIL_RE = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9-]+(\.[A-Za-z0-9-]+)*\.[A-Za-z]{2,}$/;

function parseEmail(raw) {
  const s = normalizeInput(raw).replace(/^mailto:/i, '');
  if (!s) return { empty: true };
  if (s.length > 120 || !EMAIL_RE.test(s)) return { ok: false, code: 'email' };
  return { ok: true, url: 'mailto:' + s, shown: s };
}

function parsePhoneOrWa(raw) {
  const s = normalizeInput(raw);
  if (!s) return { empty: true };
  if (/[a-z]/i.test(s)) {
    const u = parseWebUrl(s);
    if (!u) return { ok: false, code: 'url' };
    if (!hostAllowed(u.hostname, ['wa.me', 'whatsapp.com'])) return { ok: false, code: 'host' };
    if (u.pathname.length <= 1 && !u.search) return { ok: false, code: 'path' };
    return { ok: true, url: u.href, shown: shortShown(u) };
  }
  let d = s.replace(/[\s\-().]/g, '');
  if (d.charAt(0) === '+') d = d.slice(1);
  if (d.indexOf('00') === 0) d = d.slice(2);
  if (!/^\d+$/.test(d)) return { ok: false, code: 'phone' };
  if (d.charAt(0) === '0') return { ok: false, code: 'phoneLocal' };
  if (d.length < 8 || d.length > 15) return { ok: false, code: 'phoneLen' };
  return { ok: true, url: 'https://wa.me/' + d, shown: 'wa.me/' + d };
}

/* Custom platform link: any http(s) site, mailto: or tel: */
function parseCustomUrl(raw) {
  const s = normalizeInput(raw);
  if (!s) return { empty: true };
  if (/^mailto:/i.test(s)) {

  if (!u) return { ok: false, code: 'url' };

function resolveCard(c) {

    if (!r.ok) return null;

    if (!n) return null;

    return { t: 'c', u: r.url, n: n, i: i };
  }
  const p = PLATFORM_BY_ID[c.t];

/* ---------------- config <-> link payload ---------------- */
function b64uEncode(bytes) {
  let s = '';
  const CH = 0x8000;
  for (let i = 0; i < bytes.length; i += CH) s += String.fromCharCode.apply(null, bytes.subarray(i, i + CH));
  return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64uDecode(str) {
  str = str.replace(/-/g, '+').replace(/_/g, '/');
  while (str.length % 4) str += '=';
  const bin = atob(str);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}

/* cfg: {name, bio, lang, theme, cards:[{t,u,n?,i?}], avatar: Uint8Array|null} (cards already resolved) */
function encodePayload(cfg) {
  const json = JSON.stringify({
    n: cfg.name, b: cfg.bio || '', l: cfg.lang, t: cfg.theme,
    c: cfg.cards.map((c) => (c.t === 'c' ? [c.t, c.u, c.n, c.i] : [c.t, c.u]))
  });
  const jb = new TextEncoder().encode(json);
  const av = cfg.avatar || new Uint8Array(0);
  const out = new Uint8Array(3 + jb.length + av.length);
  out[0] = 1;
  out[1] = (jb.length >> 8) & 255;
  out[2] = jb.length & 255;
  out.set(jb, 3);
  out.set(av, 3 + jb.length);
  return b64uEncode(out);
}

/* Returns a sanitized config or null. Never trusts anything in the payload. */
function decodePayload(str) {
  try {
    if (!str || str.length > 60000 || !/^[A-Za-z0-9_-]+$/.test(str)) return null;
    const b = b64uDecode(str);
    if (b.length < 4 || b[0] !== 1) return null;
    const jl = (b[1] << 8) | b[2];
    if (3 + jl > b.length) return null;
    const o = JSON.parse(new TextDecoder().decode(b.subarray(3, 3 + jl)));
    if (!o || typeof o !== 'object' || !Array.isArray(o.c)) return null;
    const cards = [];
    o.c.slice(0, MAX_CARDS).forEach((row) => {
      if (!Array.isArray(row)) return;
      const r = resolveCard({ t: row[0], u: row[1], n: row[2], i: row[3] });
      if (r) cards.push(r);
    });
    if (!cards.length) return null;
    let av = b.subarray(3 + jl);
    if (av.length && !(av.length > 4 && av[0] === 0xFF && av[1] === 0xD8 && av[2] === 0xFF)) av = new Uint8Array(0);
    if (av.length > 40000) av = new Uint8Array(0);
    return {
      name: normalizeInput(o.n).slice(0, 40),
      bio: normalizeInput(o.b).slice(0, 90),
      lang: o.l === 'en' ? 'en' : 'ar',
      theme: THEMES.indexOf(o.t) !== -1 ? o.t : 'black',
      cards: cards,
      avatar: av.length ? new Uint8Array(av) : null
    };
  } catch (e) {
    return null;
  }
}

function makeSlug(name) {
  let base = String(name || '').toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 18);
  if (base.length < 2) base = 'site';
  let rnd = '';
  const abc = 'abcdefghjkmnpqrstuvwxyz23456789';
  const buf = new Uint8Array(5);
  (window.crypto || window.msCrypto).getRandomValues(buf);
  for (let i = 0; i < buf.length; i++) rnd += abc[buf[i] % abc.length];
  return base + '-' + rnd;
}

function buildSiteUrl(cfg) {
  const u = new URL('site.html', window.location.href);
  u.search = '?u=' + makeSlug(cfg.name);
  u.hash = '#' + encodePayload(cfg);
  return u.href;
}

/* ------------------------------------------------------------------
   Card deck: a front card with the others fanned behind it, left and right.
   Drag or swipe to rotate, tap a side card to bring it forward.
   Works for 1..N cards (wraps around from 3 cards up, clamps below).
------------------------------------------------------------------- */
function createDeck(stack, opts) {
  opts = opts || {};
  const ac = new AbortController();
  const on = (el, type, fn, o) => el.addEventListener(type, fn, Object.assign({ signal: ac.signal }, o || {}));

  let slots = [];
  let N = 0;
  let active = 0;
  let t = 0;
  let drag = null;
  let blockClick = false;
  const known = new WeakSet();
  const prevE = new WeakMap();

  const slotW = () => (slots[0] && slots[0].offsetWidth) || 144;
  const STEP = (w) => w * 0.64;
  const wrapOn = () => N >= 3;
  const wrapV = (v) => { const h = N / 2; return ((v + h) % N + N) % N - h; };

  /* e = 0 for the front card, +-1 for its neighbours, +-2 beyond. */
  function pose(e, w) {
    const a = Math.abs(e);
    const s = e < 0 ? -1 : 1;
    return {
      x: s * (a <= 1 ? STEP(w) * a : STEP(w) + w * 0.31 * (a - 1)),
      zd: -(a <= 1 ? 62 * a : 62 + 52 * (a - 1)),
      ry: -s * (a <= 1 ? 40 * a : 40 + 14 * (a - 1)),
      sc: 1 - 0.03 * Math.min(a, 2.5),
      op: a <= 2 ? 1 : Math.max(0, 1 - (a - 2) * 2),
      z: 100 - Math.round(a * 20),
      veil: Math.min(a, 2) * 0.22
    };
  }

  function relPos(i) {
    let d = i - active;
    if (wrapOn()) d = wrapV(d);
    let e = d + t;
    if (wrapOn()) e = wrapV(e);
    return e;
  }

  function render() {
    const w = slotW();
    slots.forEach((el, i) => {
      const e = relPos(i);
      const p = pose(e, w);
      const was = prevE.has(el) ? prevE.get(el) : e;
      prevE.set(el, e);
      const jumped = wrapOn() && Math.abs(e - was) > N / 2;
      el.classList.toggle('is-front', i === active);
      const tf = 'translate(-50%, -50%) translate3d(' + p.x.toFixed(2) + 'px, 0, ' + p.zd.toFixed(1) + 'px) rotateY(' + p.ry.toFixed(2) + 'deg) scale(' + p.sc.toFixed(3) + ')';
      const s = el.style;
      if (el._fresh) {
        el._fresh = false;
        s.transition = 'none';
        s.opacity = '0';
        s.transform = tf;
        s.zIndex = p.z;
        s.setProperty('--veil', p.veil.toFixed(3));
        void el.offsetWidth;
        s.transition = '';
      } else if (jumped && !drag) {
        s.transition = 'none';
        s.opacity = '0';
        s.transform = tf;
        s.zIndex = p.z;
        s.setProperty('--veil', p.veil.toFixed(3));
        void el.offsetWidth;
        s.transition = '';
      }
      s.setProperty('--veil', p.veil.toFixed(3));
      s.transform = tf;
      s.opacity = p.op;
      s.zIndex = p.z;
    });
  }

  function emit() { if (opts.onChange) opts.onChange(active, slots[active] || null); }

  function goTo(i) {
    if (!N) return;
    i = wrapOn() ? ((i % N) + N) % N : Math.max(0, Math.min(N - 1, i));
    if (i === active) return;
    active = i;
    t = 0;
    render();
    emit();
  }

  function sync(first) {
    const prevActive = slots[active] || null;
    slots = Array.from(stack.children).filter((el) => el.classList.contains('cs-slot') && !el.classList.contains('is-leaving'));
    N = slots.length;
    slots.forEach((el) => {
      if (!known.has(el)) {
        known.add(el);
        el._fresh = !first;
      }
    });
    const keep = prevActive ? slots.indexOf(prevActive) : -1;
    active = keep !== -1 ? keep : Math.max(0, Math.min(N - 1, active));
    t = 0;
    render();
  }

  /* ---- drag / swipe ---- */
  function bounds() {
    if (wrapOn()) return [-1, 1];
    return [active < N - 1 ? -1 : 0, active > 0 ? 1 : 0];
  }

  on(stack, 'pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    if (N < 2 || opts.disabled && opts.disabled()) return;
    if (e.target.closest && e.target.closest('.cs-share-btn')) return;
    drag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, lx: e.clientX, lt: performance.now(), v: 0, moved: false, dx: 0 };
  });

  on(stack, 'pointermove', (e) => {
    if (!drag || e.pointerId !== drag.id) return;
    const dx = e.clientX - drag.x0;
    if (!drag.moved) {
      if (Math.abs(dx) < 6 || Math.abs(dx) < Math.abs(e.clientY - drag.y0)) return;
      drag.moved = true;
      stack.classList.add('is-dragging');
      try { stack.setPointerCapture(e.pointerId); } catch (_) { /* ignore */ }
      if (opts.onDragStart) opts.onDragStart();
    }
    const now = performance.now();
    const dt = Math.max(1, now - drag.lt);
    drag.v = 0.7 * drag.v + 0.3 * ((e.clientX - drag.lx) / dt);
    drag.lx = e.clientX;
    drag.lt = now;
    drag.dx = dx;
    const k = opts.scale ? (opts.scale() || 1) : 1;
    let raw = dx / k / STEP(slotW());
    const b = bounds();
    if (raw < b[0]) raw = b[0] + (raw - b[0]) * 0.22;
    else if (raw > b[1]) raw = b[1] + (raw - b[1]) * 0.22;
    t = Math.max(-1.25, Math.min(1.25, raw));
    render();
  });

  function end(e, cancelled) {
    if (!drag || e.pointerId !== drag.id) return;
    const d = drag;
    drag = null;
    stack.classList.remove('is-dragging');
    try { stack.releasePointerCapture(e.pointerId); } catch (_) { /* ignore */ }
    if (!d.moved) return;
    blockClick = true;
    setTimeout(() => { blockClick = false; }, 80);
    let dir = 0;
    if (!cancelled) {
      if (d.dx < -36 || (d.v < -0.35 && d.dx < -10)) dir = 1;
      else if (d.dx > 36 || (d.v > 0.35 && d.dx > 10)) dir = -1;
    }
    if (!wrapOn()) {
      if (dir === 1 && active >= N - 1) dir = 0;
      if (dir === -1 && active <= 0) dir = 0;
    }
    if (dir) active = wrapOn() ? ((active + dir) % N + N) % N : active + dir;
    t = 0;
    render();
    if (dir) emit();
  }
  on(stack, 'pointerup', (e) => end(e, false));
  on(stack, 'pointercancel', (e) => end(e, true));

  /* A tap on a side card brings it forward; only the front card opens its link. */
  on(stack, 'click', (e) => {
    const slot = e.target.closest ? e.target.closest('.cs-slot') : null;
    if (!slot) return;
    if (blockClick) { e.preventDefault(); e.stopImmediatePropagation(); return; }
    const i = slots.indexOf(slot);
    if (i !== -1 && i !== active) { e.preventDefault(); e.stopImmediatePropagation(); goTo(i); }
  }, { capture: true });

  on(stack, 'focusin', (e) => {
    const slot = e.target.closest ? e.target.closest('.cs-slot') : null;
    const i = slot ? slots.indexOf(slot) : -1;
    if (i !== -1 && i !== active && !drag) goTo(i);
  });

  on(stack, 'keydown', (e) => {
    if (e.key === 'ArrowLeft') { e.preventDefault(); goTo(active + 1); }
    else if (e.key === 'ArrowRight') { e.preventDefault(); goTo(active - 1); }
  });

  on(window, 'resize', render);

  stack.classList.add('no-trans');
  sync(true);
  requestAnimationFrame(() => requestAnimationFrame(() => stack.classList.remove('no-trans')));

  return {
    sync: () => sync(false),
    render: render,
    goTo: goTo,
    focusEl: (el) => { const i = slots.indexOf(el); if (i !== -1) goTo(i); },
    get index() { return active; },
    get count() { return N; },
    destroy: () => ac.abort()
  };
}

/* ------------------------------------------------------------------
   renderSite(root, cfg, opts) builds a client page inside `root`.
   cfg: { name, bio, lang, theme, avatarUrl, ghostName, cards:[{k,t,u,n?,i?}] }
   opts: { preview, intro, headingTag }
   Text is always set with textContent; links are re-validated upstream.
------------------------------------------------------------------- */
const SITE_I18N = {
  ar: { wish: 'يوماً سعيداً', redirect: 'سيتم انتقالك خلال', go: 'جاري الانتقال...', cancel: 'إلغاء', shareTitle: 'مشاركة الرابط', copy: 'نسخ الرابط', copied: 'تم النسخ!', apps: 'مشاركة عبر التطبيقات', shareAria: 'مشاركة', close: 'إغلاق', noShare: 'متصفحك لا يدعم هذه الميزة' },
  en: { wish: 'Have a nice day', redirect: 'Redirecting in', go: 'Redirecting...', cancel: 'Cancel', shareTitle: 'Share link', copy: 'Copy link', copied: 'Copied!', apps: 'Share via apps', shareAria: 'Share', close: 'Close', noShare: 'Your browser does not support this' }
};
const REDIRECT_SECONDS = 3;

function csEl(tag, cls, text) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (text != null) e.textContent = text;
  return e;
}

function renderSite(root, cfg, opts) {
  opts = opts || {};
  const preview = !!opts.preview;
  const ac = new AbortController();
  let cur = cfg;
  let deckCtl = null;
  const recs = new Map();

  root.textContent = '';
  root.classList.add('cs');
  root.classList.toggle('is-preview', preview);
  root.classList.toggle('is-intro', !!opts.intro);

  /* background layers (all four, cross-faded) + meteors */
  const bgs = {};
  THEMES.forEach((th) => {
    const b = csEl('div', 'cs-bg t-' + th);
    b.setAttribute('aria-hidden', 'true');
    bgs[th] = b;
    root.appendChild(b);
  });
  const meteors = csEl('div', 'cs-meteors');
  meteors.setAttribute('aria-hidden', 'true');
  meteors.appendChild(csEl('div', 'cs-meteor'));
  meteors.appendChild(csEl('div', 'cs-meteor m2'));
  root.appendChild(meteors);

  const scroll = csEl('div', 'cs-scroll');
  const main = csEl('main', 'cs-main');
  const avatar = csEl('div', 'cs-avatar');
  const nameEl = csEl(opts.headingTag || 'h1', 'cs-name');
  const bioEl = csEl('p', 'cs-bio');
  const deckEl = csEl('div', 'cs-deck');
  deckEl.setAttribute('role', 'group');
  const timer = csEl('div', 'cs-timer');
  timer.setAttribute('aria-live', 'polite');
  const wish = csEl('div', 'cs-wish');
  main.append(avatar, nameEl, bioEl, deckEl, timer, wish);
  scroll.append(main);
  root.appendChild(scroll);

  const overlay = csEl('div', 'cs-overlay');
  const pop = csEl('div', 'cs-pop');
  pop.setAttribute('role', 'dialog');
  pop.setAttribute('aria-modal', 'true');
  const popX = csEl('button', 'cs-pop-x');
  popX.type = 'button';
  popX.innerHTML = uiIcon('x', 14);
  const popTitle = csEl('h3');
  const popDesc = csEl('p');
  const popCopy = csEl('button', 'cs-pop-btn');
  popCopy.type = 'button';
  const popCopyTxt = csEl('span');
  popCopy.innerHTML = uiIcon('copy', 18);
  popCopy.appendChild(popCopyTxt);
  const popNative = csEl('button', 'cs-pop-btn');
  popNative.type = 'button';
  const popNativeTxt = csEl('span');
  popNative.innerHTML = uiIcon('share', 18);
  popNative.appendChild(popNativeTxt);
  pop.append(popX, popTitle, popDesc, popCopy, popNative);
  root.append(overlay, pop);

  const T = () => SITE_I18N[cur.lang] || SITE_I18N.ar;
  const fmt = (n) => n.toLocaleString(cur.lang === 'en' ? 'en-US' : 'ar-EG');

  /* ---------- redirect counter ---------- */
  let redirecting = false;
  let rInt = null;
  let rTO = null;
  function clearTimer() {
    clearInterval(rInt);
    clearTimeout(rTO);
    redirecting = false;
    timer.classList.remove('active');
    timer.textContent = '';
  }
  function startRedirect(url) {
    if (redirecting) return;
    redirecting = true;
    const t = T();
    let count = REDIRECT_SECONDS;
    timer.textContent = '';
    const row = csEl('div', 'row');
    const spin = csEl('span', 'cs-spin');
    for (let i = 0; i < 12; i++) spin.appendChild(document.createElement('i'));
    const txt = csEl('span');
    const countSpan = csEl('span', null, fmt(count));
    txt.append(t.redirect + ' ', countSpan);
    const cancel = csEl('button', 'cs-cancel', t.cancel);
    cancel.type = 'button';
    row.append(spin, txt, cancel);
    timer.appendChild(row);
    timer.classList.add('active');
    cancel.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); clearTimer(); });
    rInt = setInterval(() => {
      count--;
      if (count > 0) {
        countSpan.textContent = fmt(count);
      } else {
        clearInterval(rInt);
        cancel.hidden = true;
        const done = csEl('span', 'cs-done');
        done.innerHTML = uiIcon('check', 18);
        spin.replaceWith(done);
        txt.textContent = t.go;
        rTO = setTimeout(() => {
          window.location.href = url;
          rTO = setTimeout(clearTimer, 600);
        }, 500);
      }
    }, 1000);
  }

  /* ---------- share popup ---------- */
  let shareUrl = '';
  let shareLabel = '';
  function openShare(rec) {
    shareUrl = rec.data.u.indexOf('mailto:') === 0 ? rec.data.u.slice(7) : rec.data.u;
    shareLabel = rec.label;
    popDesc.textContent = shareLabel;
    overlay.classList.add('active');
    pop.classList.add('active');
    popCopy.focus({ preventScroll: true });
  }
  function closeShare() {
    overlay.classList.remove('active');
    pop.classList.remove('active');
  }
  overlay.addEventListener('click', closeShare);
  popX.addEventListener('click', closeShare);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeShare(); }, { signal: ac.signal });
  popCopy.addEventListener('click', () => {
    const t = T();
    const done = () => { popCopyTxt.textContent = t.copied; setTimeout(() => { popCopyTxt.textContent = t.copy; }, 1800); };
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(shareUrl).then(done).catch(() => { popCopyTxt.textContent = t.noShare; });
    } else {
      popCopyTxt.textContent = t.noShare;
    }
  });
  popNative.addEventListener('click', () => {
    if (navigator.share) navigator.share({ title: cur.name || shareLabel, url: shareUrl }).catch(() => {});
    else popNativeTxt.textContent = T().noShare;
  });

  /* ---------- cards ---------- */
  function cardLabel(c) {
    if (c.t === 'c' || c.t === 'e') return c.n || '';
    const p = PLATFORM_BY_ID[c.t];
    return p ? p.name[cur.lang === 'en' ? 'en' : 'ar'] : '';
  }

  function paintCard(rec, c) {
    rec.data = c;
    rec.label = cardLabel(c);
    rec.a.href = c.u;
    rec.a.setAttribute('aria-label', rec.label);
    rec.share.setAttribute('aria-label', T().shareAria + ': ' + rec.label);
    rec.a.classList.toggle('is-empty', c.t === 'e');
    if (c.t === 'e') {
      rec.a.style.setProperty('--accent', '255,255,255');
      rec.a.style.removeProperty('--brand');
      rec.a.innerHTML = uiIcon('plus', 46);
      rec.a.appendChild(csEl('span', 'cs-label', c.n));
    } else if (c.t === 'c') {
      rec.a.style.setProperty('--accent', '255,255,255');
      rec.a.style.removeProperty('--brand');
      rec.a.innerHTML = uiIcon(CUSTOM_ICONS[c.i] || 'link', 46);
      const lbl = csEl('span', 'cs-label', c.n);
      rec.a.appendChild(lbl);
    } else {
      const p = PLATFORM_BY_ID[c.t];
      rec.a.style.setProperty('--accent', p.accent);
      rec.a.style.setProperty('--brand', p.color);
      rec.a.innerHTML = brandIcon(p.id, 52);
    }
  }

  function buildSlot(k, c, idx) {
    const slot = csEl('div', 'cs-slot');
    slot.style.setProperty('--i', idx);
    const a = csEl('a', 'cs-card');
    a.draggable = false;
    const share = csEl('button', 'cs-share-btn');
    share.type = 'button';
    share.innerHTML = uiIcon('share', 15);
    slot.append(a, share);
    const rec = { k: k, slot: slot, a: a, share: share, data: c, label: '' };
    a.addEventListener('click', (e) => {
      e.preventDefault();
      if (preview) return;
      startRedirect(rec.data.u);
    });
    share.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); if (!preview) openShare(rec); });
    paintCard(rec, c);
    return rec;
  }

  function setCards(cards) {
    const seen = new Set();
    const order = [];
    cards.forEach((c, i) => {
      const k = c.k != null ? String(c.k) : 'i' + i;
      seen.add(k);
      let rec = recs.get(k);
      if (!rec) {
        rec = buildSlot(k, c, i);
        recs.set(k, rec);
      } else {
        rec.slot.style.setProperty('--i', i);
        paintCard(rec, c);
      }
      order.push(rec);
    });
    recs.forEach((rec, k) => {
      if (!seen.has(k)) {
        rec.slot.classList.add('is-leaving');
        const s = rec.slot;
        setTimeout(() => s.remove(), 320);
        recs.delete(k);
      }
    });
    const domOrder = Array.from(deckEl.children).filter((n) => !n.classList.contains('is-leaving'));
    const same = domOrder.length === order.length && domOrder.every((n, i) => n === order[i].slot);
    if (!same) order.forEach((rec) => deckEl.appendChild(rec.slot));
    if (!deckCtl) {
      deckCtl = createDeck(deckEl, { onDragStart: clearTimer, scale: opts.scale });
    } else {
      deckCtl.sync();
    }
  }

  /* ---------- everything else ---------- */
  function apply() {
    const lang = cur.lang === 'en' ? 'en' : 'ar';
    const t = T();
    root.setAttribute('dir', lang === 'ar' ? 'rtl' : 'ltr');
    root.setAttribute('lang', lang);
    const theme = THEMES.indexOf(cur.theme) !== -1 ? cur.theme : 'black';
    root.setAttribute('data-theme', theme);
    THEMES.forEach((th) => bgs[th].classList.toggle('on', th === theme));

    nameEl.textContent = cur.name || '';
    nameEl.classList.toggle('is-ar', /[؀-ۿ]/.test(cur.name || ''));
    nameEl.style.opacity = cur.ghostName ? '0.45' : '';
    bioEl.textContent = cur.bio || '';
    wish.textContent = t.wish;

    avatar.textContent = '';
    if (cur.avatarUrl) {
      const img = new Image();
      img.alt = '';
      img.draggable = false;
      img.onerror = () => { img.remove(); };
      img.src = cur.avatarUrl;
      avatar.appendChild(img);
      avatar.hidden = false;
    } else if (cur.name && !cur.ghostName) {
      avatar.textContent = Array.from(cur.name.trim())[0] || '';
      avatar.hidden = false;
    } else if (cur.ghostName) {
      avatar.innerHTML = uiIcon('user', 40);
      avatar.hidden = false;
    } else {
      avatar.hidden = true;
    }
    avatar.style.opacity = cur.ghostName && !cur.avatarUrl ? '0.45' : '';

    popTitle.textContent = t.shareTitle;
    popCopyTxt.textContent = t.copy;
    popNativeTxt.textContent = t.apps;
    popX.setAttribute('aria-label', t.close);
    pop.setAttribute('aria-label', t.shareTitle);
    deckEl.setAttribute('aria-label', cur.name || '');

    setCards(cur.cards || []);
  }

  apply();

  return {
    root: root,
    update: (next) => { cur = next; apply(); },
    focusCard: (k) => { const rec = recs.get(String(k)); if (rec && deckCtl) deckCtl.focusEl(rec.slot); },
    destroy: () => {
      ac.abort();
      clearTimer();
      if (deckCtl) deckCtl.destroy();
      root.textContent = '';
    }
  };
}

(function () {
  'use strict';
  const app = document.getElementById('app');
  const BUILDER = 'builder.html';
  let inst = null;
  let avatarUrl = null;
  const META = { black: '#000000', blue: '#0a2fa8', pink: '#8a1450', brown: '#1b0d06', white: '#eceff7' };

  function showBad() {
    if (inst) { inst.destroy(); inst = null; }
    app.className = '';
    app.textContent = '';
    document.title = 'صفحتي | My page';
    const wrap = document.createElement('div');
    wrap.className = 'bad';
    wrap.innerHTML = '<div class="bad-card" role="alert">' +
      '<svg class="ico" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>' +
      '<h1></h1><p></p><a></a></div>';
    const card = wrap.firstChild;
    card.querySelector('h1').textContent = 'هذا الرابط غير صالح أو غير مكتمل';
    card.querySelector('p').textContent = 'انسخ الرابط كاملًا كما وصلك، أو أنشئ صفحتك من جديد. This link is invalid or incomplete.';
    const a = card.querySelector('a');
    a.href = BUILDER;
    a.textContent = 'أنشئ صفحتك';
    app.appendChild(wrap);
  }

  function boot() {
    const cfg = decodePayload(location.hash.slice(1));
    if (!cfg) { showBad(); return; }
    if (avatarUrl) { URL.revokeObjectURL(avatarUrl); avatarUrl = null; }
    if (cfg.avatar) avatarUrl = URL.createObjectURL(new Blob([cfg.avatar], { type: 'image/jpeg' }));
    document.documentElement.lang = cfg.lang;
    document.documentElement.dir = cfg.lang === 'ar' ? 'rtl' : 'ltr';
    document.title = cfg.name || 'صفحتي';
    const m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', META[cfg.theme] || '#000000');
    document.body.style.background = META[cfg.theme] || '#000';
    if (inst) inst.destroy();
    app.textContent = '';
    inst = renderSite(app, {
      name: cfg.name, bio: cfg.bio, lang: cfg.lang, theme: cfg.theme, avatarUrl: avatarUrl,
      cards: cfg.cards.map((c, i) => Object.assign({ k: i }, c))
    }, { intro: true });
  }
  window.addEventListener('hashchange', boot);
  boot();
})();
</script>
